image:
  server:
    repository: ghcr.io/patchmon/patchmon-server
    # tag defaults to Chart.appVersion
    # tag: ""
    pullPolicy: IfNotPresent

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

# -----------------------------------------------------------
# Choose ONE exposure method (gatewayAPI OR ingress)
# -----------------------------------------------------------
gatewayAPI:
  enabled: true
  parentRefs:
    - name: internal-gateway
      namespace: gateways
      # sectionName: https
  hostnames:
    - patchmon.example.com

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: patchmon.example.com
  tls: []

# -----------------------------------------------------------
# PatchMon application settings
# -----------------------------------------------------------
patchmon:
  logLevel: info

  server:
    corsOrigin: https://patchmon.example.com
    trustProxy: true
    enableHsts: true
    # port: 3000  # override the listening port inside the container

  oidc:
    enabled: false
    issuerUrl: ""
    clientId: "patchmon"
    clientSecret: ""
    clientSecretFromSecret:
      name: ""
      key: "client-secret"
    redirectUri: "https://patchmon.example.com/api/v1/auth/oidc/callback"
    scopes: "openid email profile groups"
    autoCreateUsers: true
    defaultRole: "user"
    buttonText: "Login with SSO"
    disableLocalAuth: false
    syncRoles: false
    enforceHttps: true
    sessionTtl: 600
    postLogoutUri: ""
    adminGroup: ""
    userGroup: ""
    superAdminGroup: ""
    hostManagerGroup: ""
    readOnlyGroup: ""

  jwt:
    # If empty, a random value is generated and persisted in the Secret via lookup.
    secret: ""
    expiresIn: "1h"

  auth:
    maxLoginAttempts: 5
    lockoutDurationMinutes: 15
    sessionInactivityTimeoutMinutes: 30
    browserSessionCookies: true
    tfaMaxRememberSessions: 5
    maxTfaAttempts: 5
    tfaLockoutDurationMinutes: 30
    tfaRememberMeExpiresIn: "30d"

  passwordPolicy:
    minLength: 8
    requireUppercase: true
    requireLowercase: true
    requireNumber: true
    requireSpecial: true

  dbPool:
    connectionLimit: 30
    connectTimeout: 10
    transactionLongTimeout: 60000
    connMaxAttempts: 30
    connWaitInterval: 2

  rateLimit:
    windowMs: 900000
    max: 5000
    authWindowMs: 600000
    authMax: 500
    agentWindowMs: 60000
    agentMax: 1000
    passwordWindowMs: 900000
    passwordMax: 5

  bodyLimits:
    json: "5mb"
    agentUpdate: "2mb"

  timezone: "UTC"

  persistence:
    agentFiles:
      enabled: true
      accessModes: ["ReadWriteOnce"]
      size: 1Gi
      storageClassName: ""

  redis:
    host: ""
    port: ""
    db: 0
    tls: false
    tlsVerify: false
    # tlsCa: ""
    connectTimeoutMs: 60000
    commandTimeoutMs: 60000

# -----------------------------------------------------------
# Guacd sidecar (Windows RDP support)
# -----------------------------------------------------------
guacd:
  enabled: true
  image: guacamole/guacd:latest
  pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 512Mi
      cpu: "1.0"
  securityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL

# -----------------------------------------------------------
# Database configuration
# -----------------------------------------------------------
database:
  mode: internal  # internal | external

postgres:
  image: postgres:17-alpine
  storage:
    size: 10Gi
    # storageClassName: ""
  resources: {}
  securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  auth:
    database: patchmon_db
    username: patchmon_user
    # password stored in chart secret (POSTGRES_PASSWORD)
    # existingSecret: ""
    # existingSecretPasswordKey: "password"

external:
  postgres:
    uri: ""
    uriFromSecret:
      name: ""
      key: "uri"
    host: ""
    port: 5432
    database: "patchmon_db"
    username: "patchmon_user"
    password: ""
    passwordFromSecret:
      name: ""
      key: "password"
    sslMode: ""

# -----------------------------------------------------------
# Valkey (Redis-compatible cache/queue)
# -----------------------------------------------------------
valkey:
  enabled: true

  # To enable Valkey auth, set auth.enabled: true and configure aclUsers.
  # You must also set auth.usersExistingSecret to the chart secret name
  # (e.g. "<release>-patchmon") with passwordKey: REDIS_PASSWORD, or
  # provide an inline password. See the Valkey chart docs for details.
  auth:
    enabled: false

  service:
    port: 6379

  replica:
    enabled: true
    persistence:
      size: 1Gi

resources: {}

# startupProbe guards slow DB migrations on upgrade. While it runs,
# liveness/readiness are disabled, giving the server up to
# failureThreshold * periodSeconds (~5 min below) to finish migrations
# before the kubelet starts killing the container. Set to {} to disable.
startupProbe:
  httpGet:
    path: /health
    port: http
    # Host must be loopback — the server's CORS middleware returns 403
    # host_mismatch for any Host not in CORS_ORIGIN (the pod IP would fail).
    httpHeaders:
      - name: Host
        value: localhost
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

pdb:
  create: false
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
