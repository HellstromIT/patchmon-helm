{{- $s := lookup "v1" "Secret" .Release.Namespace (include "patchmon.fullname" .) -}}

{{- $oldPg := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "POSTGRES_PASSWORD") -}}
{{- $oldPg = (index (index $s "data") "POSTGRES_PASSWORD") | b64dec -}}
{{- end -}}

{{- $oldJwt := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "JWT_SECRET") -}}
{{- $oldJwt = (index (index $s "data") "JWT_SECRET") | b64dec -}}
{{- end -}}

{{- $oldSession := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "SESSION_SECRET") -}}
{{- $oldSession = (index (index $s "data") "SESSION_SECRET") | b64dec -}}
{{- end -}}

{{- $oldAiKey := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "AI_ENCRYPTION_KEY") -}}
{{- $oldAiKey = (index (index $s "data") "AI_ENCRYPTION_KEY") | b64dec -}}
{{- end -}}

{{- $oldRedis := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "REDIS_PASSWORD") -}}
{{- $oldRedis = (index (index $s "data") "REDIS_PASSWORD") | b64dec -}}
{{- end -}}

{{- $oldOidc := "" -}}
{{- if and $s (index $s "data") (index (index $s "data") "OIDC_CLIENT_SECRET") -}}
{{- $oldOidc = (index (index $s "data") "OIDC_CLIENT_SECRET") | b64dec -}}
{{- end -}}

{{- /*
  Read the pinnable secrets with `dig` rather than a direct path. `helm upgrade
  --reuse-values` substitutes the previous release's values for the incoming
  chart's defaults instead of merging them, so a release created before these
  keys existed has no `patchmon.session` / `patchmon.encryption` map at all and
  a direct `.Values.patchmon.session.secret` fails to render with
  "nil pointer evaluating interface {}.secret".
*/ -}}
{{- $jwtVal := dig "jwt" "secret" "" .Values.patchmon -}}
{{- $sessionVal := dig "session" "secret" "" .Values.patchmon -}}
{{- $aiKeyVal := dig "encryption" "aiKey" "" .Values.patchmon -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchmon.fullname" . }}
  labels:
    {{- include "patchmon.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if and (eq .Values.database.mode "internal") (not .Values.postgres.auth.existingSecret) }}
  POSTGRES_PASSWORD: {{ default (randAlphaNum 32) $oldPg | quote }}
{{- end }}
  JWT_SECRET: {{ default (randAlphaNum 64) (default $oldJwt $jwtVal) | quote }}
  SESSION_SECRET: {{ default (randAlphaNum 64) (default $oldSession $sessionVal) | quote }}
  AI_ENCRYPTION_KEY: {{ default (randAlphaNum 64) (default $oldAiKey $aiKeyVal) | quote }}
{{- if .Values.valkey.auth.enabled }}
  REDIS_PASSWORD: {{ default (randAlphaNum 32) $oldRedis | quote }}
{{- end }}
{{- if and .Values.patchmon.oidc.enabled (not (and .Values.patchmon.oidc.clientSecretFromSecret.name (ne .Values.patchmon.oidc.clientSecretFromSecret.name ""))) }}
  OIDC_CLIENT_SECRET: {{ default $oldOidc .Values.patchmon.oidc.clientSecret | required "patchmon.oidc.clientSecret is required when oidc is enabled and clientSecretFromSecret.name is not set" | quote }}
{{- end }}
