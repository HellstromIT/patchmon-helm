{{- include "patchmon.db.external.validate" . -}}
{{- include "patchmon.exposure.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchmon.fullname" . }}-server
  labels:
    {{- include "patchmon.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "patchmon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "patchmon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-server.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "patchmon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.server.repository }}:{{ default .Chart.AppVersion .Values.image.server.tag }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "patchmon.fullname" . }}-server

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchmon.fullname" . }}
                  key: JWT_SECRET

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchmon.fullname" . }}
                  key: SESSION_SECRET

            - name: AI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchmon.fullname" . }}
                  key: AI_ENCRYPTION_KEY

            {{- if .Values.patchmon.oidc.enabled }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if and .Values.patchmon.oidc.clientSecretFromSecret.name (ne .Values.patchmon.oidc.clientSecretFromSecret.name "") }}
                  name: {{ .Values.patchmon.oidc.clientSecretFromSecret.name | quote }}
                  key:  {{ .Values.patchmon.oidc.clientSecretFromSecret.key  | quote }}
                  {{- else }}
                  name: {{ include "patchmon.fullname" . | quote }}
                  key:  OIDC_CLIENT_SECRET
                  {{- end }}
            {{- end }}

            # ----------------
            # Database
            # ----------------
            {{- $hasUriVal := and .Values.external.postgres.uri (ne .Values.external.postgres.uri "") -}}
            {{- $hasUriSecret := and .Values.external.postgres.uriFromSecret.name (ne .Values.external.postgres.uriFromSecret.name "") -}}
            {{- $hasPwSecret := and .Values.external.postgres.passwordFromSecret.name (ne .Values.external.postgres.passwordFromSecret.name "") -}}

            {{- if eq .Values.database.mode "internal" }}
            - name: POSTGRES_HOST
              value: {{ include "patchmon.fullname" . }}-postgres
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchmon.postgres.passwordSecretName" . | quote }}
                  key: {{ include "patchmon.postgres.passwordSecretKey" . | quote }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "patchmon.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
            {{- else }}

              {{- if and (not $hasUriVal) $hasUriSecret }}
            - name: EXT_PG_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.postgres.uriFromSecret.name | quote }}
                  key: {{ .Values.external.postgres.uriFromSecret.key | quote }}
              {{- end }}

              {{- if and (not $hasUriVal) (not $hasUriSecret) $hasPwSecret }}
            - name: EXT_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.postgres.passwordFromSecret.name | quote }}
                  key: {{ .Values.external.postgres.passwordFromSecret.key | quote }}
              {{- end }}

              {{- if $hasUriVal }}
            - name: DATABASE_URL
              value: {{ .Values.external.postgres.uri | quote }}
              {{- else if $hasUriSecret }}
            - name: DATABASE_URL
              value: "$(EXT_PG_URI)"
              {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.external.postgres.host | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.external.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.external.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.external.postgres.password }}
              value: {{ .Values.external.postgres.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.postgres.passwordFromSecret.name | quote }}
                  key: {{ .Values.external.postgres.passwordFromSecret.key | quote }}
              {{- end }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.external.postgres.username }}:$(POSTGRES_PASSWORD)@{{ .Values.external.postgres.host }}:{{ .Values.external.postgres.port }}/{{ .Values.external.postgres.database }}{{- if .Values.external.postgres.sslMode -}}?sslmode={{ .Values.external.postgres.sslMode }}{{- end -}}"
              {{- end }}
            {{- end }}

            # ----------------
            # Redis / Valkey
            # ----------------
            - name: REDIS_HOST
              value: {{ include "patchmon.redis.host" . | quote }}
            - name: REDIS_PORT
              value: {{ include "patchmon.redis.port" . | quote }}
            - name: REDIS_DB
              value: {{ .Values.patchmon.redis.db | quote }}
            {{- if .Values.valkey.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "patchmon.fullname" . }}
                  key: REDIS_PASSWORD
            {{- end }}

            # ----------------
            # Guacd
            # ----------------
            {{- if .Values.guacd.enabled }}
            - name: GUACD_ADDRESS
              value: "localhost:4822"
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.guacd.enabled }}
        - name: guacd
          image: {{ .Values.guacd.image | quote }}
          imagePullPolicy: {{ .Values.guacd.pullPolicy }}
          securityContext:
            {{- toYaml .Values.guacd.securityContext | nindent 12 }}
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: guacd
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.guacd.resources | nindent 12 }}
          volumeMounts:
            - name: guacd-tmp
              mountPath: /tmp
        {{- end }}

      {{- if .Values.guacd.enabled }}
      volumes:
        - name: guacd-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
