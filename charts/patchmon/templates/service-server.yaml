apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchmon.fullname" . }}-server
  labels:
    {{- include "patchmon.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "patchmon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
